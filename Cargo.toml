[package]
name = "syna-00a2"
version = "0.1.0"
edition = "2021"
description = "Userspace driver for the Synaptics 06cb:00a2 fingerprint reader"
license = "LGPL-2.1-or-later"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
