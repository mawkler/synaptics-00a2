[package]
name = "syna-00a2"
version = "0.1.0"
edition = "2021"
description = "Userspace driver for the Synaptics 06cb:00a2 fingerprint reader"
license = "LGPL-2.1-or-later"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
